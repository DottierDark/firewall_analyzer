<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firewall Analyzer</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash; fall back to
    // the OS preference. Theme choice only — never anything sensitive.
    (function () {
      var t = localStorage.getItem("fwa-theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-brand">
        <!-- Placeholder until wirePwcLogo() probes for the real file and
             swaps this for an <img>; keeps the brand mark present either way. -->
        <svg class="pwc-logo" data-surface="dark" viewBox="0 0 200 120" role="img" aria-label="PwC">
          <path fill="#FE5108" d="M52 46 L110 46 L98 64 L40 64 Z"/>
          <path fill="#FE5108" d="M116 28 L184 28 L172 46 L104 46 Z"/>
          <text x="100" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                font-weight="700" font-size="66" letter-spacing="-3" fill="currentColor">pwc</text>
        </svg>
        <div class="side-brand-text">
          <span class="side-brand-title">Firewall Analyzer</span>
          <span class="side-brand-sub">v1.0</span>
        </div>
      </div>

      <nav class="side-nav" id="side-nav" aria-label="Main navigation"></nav>
      <div id="selection-card"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Overview</h1>
          <span class="sub" id="page-sub"></span>
        </div>
        <div class="topbar-spacer"></div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
