<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firewall Analyzer</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/report.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash; fall back to
    // the OS preference. Theme choice only — never anything sensitive.
    (function () {
      var t = localStorage.getItem("fwa-theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <!-- Sign-in gate. Shown until /api/auth/me confirms a session. -->
  <div id="login-view" class="login-view" hidden>
    <div class="login-card">
      <a class="login-back" href="/">&larr; Back to overview</a>

      <img class="pwc-logo" src="/img/pwc-logo.png" alt="PwC" />

      <div class="login-head">
        <div class="eyebrow">Firewall Analyzer</div>
        <h1>Sign in</h1>
        <p class="muted">Rule-base security assessment. Accounts are issued by your platform administrator.</p>
      </div>

      <form id="login-form" autocomplete="on">
        <label class="field">
          <span>Username</span>
          <input type="text" id="login-username" required autocomplete="username"
                 autocapitalize="none" spellcheck="false" />
        </label>
        <label class="field">
          <span>Password</span>
          <span class="pw-wrap">
            <input type="password" id="login-password" required autocomplete="current-password" />
            <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Show password">Show</button>
          </span>
        </label>

        <div id="login-error" class="login-error" role="alert" hidden></div>

        <button type="submit" id="login-submit" class="btn primary login-submit">Sign in</button>
      </form>

      <p class="login-foot">
        No sign-up: the four roles &mdash; Administrator, Executive, Security Manager and
        Analyst &mdash; are provisioned on the server.
      </p>
    </div>
  </div>

  <!-- Application shell. Shown once authenticated. -->
  <div id="app-view" class="shell" hidden>
    <aside class="sidebar">
      <div class="side-brand">
        <img class="pwc-logo" data-surface="dark" src="/img/pwc-logo-dark.png" alt="PwC" />
        <div class="side-brand-text">
          <span class="side-brand-title">Firewall Analyzer</span>
          <span class="side-brand-sub">v1.0</span>
        </div>
      </div>

      <nav class="side-nav" id="side-nav" aria-label="Main navigation"></nav>
      <div id="selection-card"></div>
      <div id="user-card"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Overview</h1>
          <span class="sub" id="page-sub"></span>
        </div>
        <div class="topbar-spacer"></div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
