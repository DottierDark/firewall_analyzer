[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firewall_analyzer"
version = "1.0.0"
description = "A comprehensive multi-vendor firewall rule security analyzer."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # All dependencies are part of the Python standard library.
    # Chart.js is loaded via CDN in the HTML report.
]

[project.scripts]
firewall-analyzer = "firewall_analyzer.cli:main"